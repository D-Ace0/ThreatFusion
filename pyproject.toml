[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatfusion"
version = "1.0.0"
description = "Privacy-conscious, explainable threat intelligence workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "typer>=0.12,<1", "rich>=13,<15", "reportlab>=4,<5", "idna>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.9,<1", "pypdf>=5,<7"]

[project.scripts]
threatfusion = "threatfusion.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatfusion = ["static/*", "fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
